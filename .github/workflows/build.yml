name: build

# Day-to-day CI runs on the laptop (scripts/ci-local.sh). GitHub Actions only builds
# releases (v* tags) and runs when started by hand, to spend as few minutes as possible.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      only:
        description: "Build only one platform (for trying a fix), or all"
        type: choice
        default: all
        options: [all, ios, android, linux, windows, macos]

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.47.8"
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Tests (Rust + Flutter)
    if: ${{ !inputs.only || inputs.only == 'all' || inputs.only == 'tests' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: The tag matches the app's version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          v="${GITHUB_REF_NAME#v}"
          grep -q "^version: $v+" app/pubspec.yaml && grep -q "appVersion = '$v'" app/lib/version.dart \
            || { echo "::error::tag $GITHUB_REF_NAME doesn't match pubspec.yaml / lib/version.dart"; exit 1; }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Build tools for the plugins' native parts (window manager)
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libx11-dev libxi-dev
      - working-directory: app
        run: |
          flutter pub get
          flutter analyze --no-fatal-infos
          flutter test

  linux:
    name: Linux
    needs: test
    if: ${{ !inputs.only || inputs.only == 'all' || inputs.only == 'linux' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libasound2-dev libx11-dev libxi-dev
      - working-directory: app
        run: flutter build linux --release
      - name: Package
        run: |
          mkdir -p dist
          tar -C app/build/linux/x64/release/bundle -czf dist/harp-linux-x64.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: harp-linux-x64
          path: dist/harp-linux-x64.tar.gz

  android:
    name: Android (arm64 APK)
    needs: test
    if: ${{ !inputs.only || inputs.only == 'all' || inputs.only == 'android' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Remember Gradle and the media player's Android libraries between runs
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/wrapper/dists
            ~/.gradle/caches/modules-2
          key: android-gradle-${{ hashFiles('app/pubspec.lock', 'app/android/gradle/wrapper/gradle-wrapper.properties', 'app/android/**/*.gradle*') }}
          restore-keys: android-gradle-
      - name: Remember the downloaded Python and QuickJS between runs
        uses: actions/cache@v4
        with:
          path: app/android/build-tools
          key: android-tools-${{ hashFiles('scripts/android-tools.sh') }}
      - name: Python and QuickJS for yt-dlp (pinned SHA-256s, retried)
        run: |
          sudo apt-get update && sudo apt-get install -y zstd
          for attempt in 1 2 3; do
            ./scripts/android-tools.sh && exit 0
            echo "attempt $attempt failed; retrying in 45 s"
            sleep 45
          done
          exit 1
      - name: The release signing key (from the repo's secrets; see scripts/release-secrets.sh)
        env:
          KEYSTORE_B64: ${{ secrets.HARP_KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            if [ "${{ startsWith(github.ref, 'refs/tags/v') }}" = "true" ]; then
              echo "::error::No signing key in secrets: run scripts/release-secrets.sh. A release must be signed with Harp's key."; exit 1
            fi
            echo "no signing key: this test build uses the debug key"; exit 0
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/harp-release.jks"
          echo "HARP_KEYSTORE_FILE=$RUNNER_TEMP/harp-release.jks" >> "$GITHUB_ENV"
      - name: Build the APK (retried on temporary download errors)
        working-directory: app
        env:
          HARP_KEYSTORE_PASSWORD: ${{ secrets.HARP_KEYSTORE_PASSWORD }}
          HARP_KEY_ALIAS: ${{ secrets.HARP_KEY_ALIAS }}
          HARP_KEY_PASSWORD: ${{ secrets.HARP_KEY_PASSWORD }}
        run: |
          # GitHub's release downloads can return 504 for several minutes, so wait it out.
          for attempt in 1 2 3 4 5 6; do
            flutter build apk --release --target-platform android-arm64 && exit 0
            echo "attempt $attempt failed; retrying in 90 s"
            sleep 90
          done
          exit 1
      - name: Check Python and QuickJS are inside the APK
        run: |
          unzip -l app/build/app/outputs/flutter-apk/app-release.apk | grep -E "libpython.so|libqjs.so|python.zip"
      - name: Check the media notification icon survived resource shrinking
        run: |
          AAPT2=$(ls -d "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)
          "$AAPT2" dump resources app/build/app/outputs/flutter-apk/app-release.apk | grep -q "drawable/ic_stat_harp" || { echo "ic_stat_harp was stripped: the media notification would crash"; exit 1; }
          echo "notification icon present"
      - name: Check the APK is signed with Harp's release key (not the debug key)
        run: |
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs app/build/app/outputs/flutter-apk/app-release.apk | tee certs.txt
          if [ "${{ startsWith(github.ref, 'refs/tags/v') }}" = "true" ]; then
            grep -q "CN=Harp" certs.txt || { echo "::error::not signed with Harp's release key"; exit 1; }
          fi
          cp app/build/app/outputs/flutter-apk/app-release.apk harp-android-arm64.apk
      - uses: actions/upload-artifact@v4
        with:
          name: harp-android-arm64
          path: harp-android-arm64.apk

  # Windows and macOS minutes cost 2x and 10x on private repos, so these run
  # for release tags and when started by hand.
  windows:
    name: Windows
    needs: test
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && (inputs.only == 'all' || inputs.only == 'windows'))
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - working-directory: app
        run: flutter build windows --release
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path app/build/windows/x64/runner/Release/* -DestinationPath dist/harp-windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: harp-windows-x64
          path: dist/harp-windows-x64.zip

  macos:
    name: macOS
    needs: test
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && (inputs.only == 'all' || inputs.only == 'macos'))
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - working-directory: app
        run: flutter build macos --release
      - name: Package
        run: |
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent app/build/macos/Build/Products/Release/harp.app dist/harp-macos.zip
      - uses: actions/upload-artifact@v4
        with:
          name: harp-macos
          path: dist/harp-macos.zip

  # iOS without an Apple developer account: an unsigned .ipa that people sign
  # with their own Apple ID when they install it (AltStore, SideStore,
  # Sideloadly) or install as is with TrollStore.
  ios:
    name: iOS (unsigned)
    needs: test
    # Alone (only: ios) it runs without the test job.
    if: always() && (needs.test.result == 'success' || needs.test.result == 'skipped') && (startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && (inputs.only == 'all' || inputs.only == 'ios')))
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios
      - uses: Swatinem/rust-cache@v2
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      # yt-dlp runs inside the iOS app's own Python (app/python/main.py, embedded
      # with serious_python): the app ships the official yt-dlp zipapp as a
      # fallback (Harp fetches the latest itself) and certifi for HTTPS.
      - name: Python bits for the iOS app
        run: |
          YTDLP=2026.10.26
          YTDLP_SUM=e51e69e89489f199530f13d32a4342da3ddb2cf34842f364603a066db05afbf3
          curl -fsSL --retry 3 -o app/assets/yt-dlp.pyz "https://github.com/yt-dlp/yt-dlp/releases/download/$YTDLP/yt-dlp"
          echo "$YTDLP_SUM  app/assets/yt-dlp.pyz" | shasum -a 256 -c
          printf 'certifi==2026.10.23 --hash=sha256:e9b54de76e530bb6cf0ccd036787103acb58fd42ba930ea8bf948ddbaa2f61d1\n' > "$RUNNER_TEMP/py-req.txt"
          for arch in iphoneos.arm64 iphonesimulator.arm64 iphonesimulator.x86_64; do
            python3 -m pip install --quiet --no-deps --only-binary=:all: --require-hashes -r "$RUNNER_TEMP/py-req.txt" --target "$RUNNER_TEMP/site-packages/$arch"
          done
          echo "SERIOUS_PYTHON_APP=$GITHUB_WORKSPACE/app/python" >> "$GITHUB_ENV"
          echo "SERIOUS_PYTHON_SITE_PACKAGES=$RUNNER_TEMP/site-packages" >> "$GITHUB_ENV"
      # CocoaPods, not Swift Package Manager: serious_python's CocoaPods route
      # prepares the embedded Python (download, app and site-packages) at pod
      # install by itself; its SwiftPM route needs a separate staging step.
      - name: Use CocoaPods for iOS plugins
        run: flutter config --no-enable-swift-package-manager
      - name: Build (unsigned)
        working-directory: app
        run: |
          set -o pipefail
          # The full Xcode log goes to a file; on failure its errors are shown
          # (Flutter's own summary hides the real cause).
          if ! flutter build ios --release --no-codesign -v > ../ios-build.log 2>&1; then
            grep -nE "error(\\[E[0-9]+\\])?:|\\*\\* BUILD FAILED|Undefined symbol|ld: " ../ios-build.log | grep -v "^.*warning" | head -60
            # The Rust side's own report, when that's what failed.
            grep -n -A120 "Cargokit BuildTool failed" ../ios-build.log | head -160
            exit 1
          fi
          tail -5 ../ios-build.log
      - name: Keep the build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-log
          path: ios-build.log
      - name: Package (.ipa, unsigned)
        run: |
          mkdir -p dist/Payload
          cp -R app/build/ios/iphoneos/Runner.app dist/Payload/
          # The embedded Python must really be inside (an empty build plays nothing).
          app=dist/Payload/Runner.app
          find "$app" -path "*Python.framework/Python" | grep -q . || { echo "no Python.framework in the app" >&2; exit 1; }
          find "$app" -path "*python.bundle/app/main.py" | grep -q . || { echo "no app/main.py in the app" >&2; exit 1; }
          find "$app" -path "*python.bundle/app/harp_jsc.py" | grep -q . || echo "note: no harp_jsc.py (step 1 build)"
          find "$app" -path "*python.bundle/stdlib/os.py" | grep -q . || { echo "no Python standard library in the app" >&2; exit 1; }
          find "$app" -path "*python.bundle/site-packages/certifi/cacert.pem" | grep -q . || { echo "no certifi in the app" >&2; exit 1; }
          cd dist && zip -qr harp-ios-unsigned.ipa Payload && rm -rf Payload
          ls -la
      - uses: actions/upload-artifact@v4
        with:
          name: harp-ios
          path: dist/harp-ios-unsigned.ipa

  release:
    name: GitHub release
    needs: [linux, android, windows, macos, ios]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${{ github.ref_name }}" dist/*
          --repo "${{ github.repository }}"
          --title "Harp ${{ github.ref_name }}"
          --latest --generate-notes
          --notes "Android: harp-android-arm64.apk, signed with Harp's release key. iOS: harp-ios-unsigned.ipa (sign it with your own Apple ID via AltStore, SideStore or Sideloadly, or install with TrollStore; see the README). Linux: harp-linux-x64.tar.gz. Windows: harp-windows-x64.zip. macOS: harp-macos.zip (not notarized; right-click and Open the first time). SHA256SUMS.txt lists the checksums."
