[workspace]
resolver = "2"
members = ["crates/harp-core", "crates/harp-ffi", "crates/harp-ytdlp", "crates/harp-party"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"

[profile.release]
lto = true
opt-level = "s"
strip = true

# netdev 0.46.3 and netwatch 0.19.3 (used by iroh) don't build for iOS: they use
# names `libc` only has for macOS. Patched copies in third_party/ (see its README).
[patch.crates-io]
netdev = { path = "third_party/netdev" }
netwatch = { path = "third_party/netwatch" }
